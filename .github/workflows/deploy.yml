name: Deploy

on:
  push:
    branches: [ "main" ]

# Um deploy por vez: dois merges seguidos entram em fila,
# e a versao mais recente e sempre a ultima a subir.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean install

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: murilozgodoy
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: murilozgodoy/projsoft-ci:${{ github.sha }}

      - name: executing remote ssh commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_TEST }}
          username: "ubuntu"
          key: ${{ secrets.KEY_TEST }}
          port: 22
          script: |
            docker pull murilozgodoy/projsoft-ci:${{ github.sha }}
            docker stop app || true
            docker rm --force app || true
            docker run -d \
              --name app \
              --network rede \
              -p 8080:8080 \
              --restart unless-stopped \
              -e DB_HOST=${{ secrets.DB_HOST }} \
              -e DB_PORT=${{ secrets.DB_PORT }} \
              -e DB_NAME=${{ secrets.DB_NAME }} \
              -e DB_USER=${{ secrets.DB_USER }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              murilozgodoy/projsoft-ci:${{ github.sha }}
            docker image prune -af
