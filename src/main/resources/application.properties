spring.application.name=avaliacoes

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:simuladodb}
spring.datasource.username=${DB_USER:usuario}
spring.datasource.password=${DB_PASSWORD:senha}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080

# Devolve a mensagem do erro no corpo (ex.: "Nota deve estar entre 0 e 10")
server.error.include-message=always

# Auth0 (o issuer PRECISA terminar com "/", igual ao campo "iss" do token)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-ko6dei5u8dvfadka.us.auth0.com/
spring.security.oauth2.resourceserver.jwt.audiences=https://dev-ko6dei5u8dvfadka.us.auth0.com/api/v2/
